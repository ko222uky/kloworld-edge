name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: compose config + Caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker network create edge && docker compose config --quiet
      - run: >
          docker run --rm -v "$PWD/caddy:/etc/caddy:ro"
          caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: shellcheck --severity=warning scripts/*.sh
